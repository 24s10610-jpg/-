<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다크 던전 - 픽셀 카드 RPG (완전판)</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'DungGeunMo', monospace;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    body {
      background-color: #050508;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      max-width: 1024px;
      max-height: 720px;
      background-color: #0c0d12;
      border: 6px solid #3b2d54;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* 상단 바 */
    #top-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #120e1e;
      padding: 12px 10px;
      border-bottom: 4px solid #281d3b;
      font-size: 1rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-item .label { color: #8b739b; }
    .status-item .value { color: #ffcc00; }

    /* 전투 필드 */
    #battle-field {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 90px 30px 90px;
      position: relative;
      background: 
        linear-gradient(rgba(12, 13, 18, 0.45), rgba(12, 13, 18, 0.9)),
        repeating-linear-gradient(0deg, transparent, transparent 32px, rgba(0, 0, 0, 0.5) 32px, rgba(0, 0, 0, 0.5) 34px),
        repeating-linear-gradient(90deg, #181925, #181925 64px, #12131c 64px, #12131c 128px);
    }

    .torch {
      position: absolute;
      top: 40px;
      width: 8px;
      height: 24px;
      background-color: #6b4d32;
    }

    .torch::after {
      content: '';
      position: absolute;
      top: -12px;
      left: -4px;
      width: 16px;
      height: 16px;
      background-color: #ff6600;
      border-radius: 50%;
      box-shadow: 0 0 20px 10px rgba(255, 102, 0, 0.6);
      animation: flicker 0.2s infinite alternate;
    }

    .torch.left { left: 12%; }
    .torch.right { right: 12%; }

    @keyframes flicker {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .entity-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .pixel-canvas {
      width: 128px;
      height: 128px;
      filter: drop-shadow(0 8px 0px rgba(0,0,0,0.6));
    }

    /* 시각 이펙트 레이어 */
    .fx-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 128px;
      height: 128px;
      pointer-events: none;
    }

    .slash-fx {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, transparent 40%, #ff0000 48%, #ffffff 50%, #ff0000 52%, transparent 60%);
      animation: slash 0.25s ease-out forwards;
    }

    @keyframes slash {
      0% { opacity: 0; transform: scale(0.5) rotate(-20deg); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.2) rotate(10deg); }
    }

    .shield-fx {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid #4cc9f0;
      background: rgba(76, 201, 240, 0.2);
      border-radius: 50%;
      animation: shield 0.4s ease-out forwards;
    }

    @keyframes shield {
      0% { opacity: 0; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1); }
    }

    .entity-info {
      width: 180px;
      text-align: center;
      margin-top: 10px;
      background-color: rgba(18, 14, 30, 0.9);
      padding: 8px;
      border: 2px solid #3b2d54;
    }

    .name { font-size: 0.95rem; margin-bottom: 6px; color: #bfa3d8; }

    .hp-bar-container {
      width: 100%;
      height: 16px;
      background-color: #0e0a14;
      border: 2px solid #524368;
      position: relative;
    }

    .hp-bar { height: 100%; background-color: #e63946; transition: width 0.3s ease; }
    .hp-bar.enemy-hp { background-color: #d62828; }

    .hp-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.8rem;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
    }

    .shield-badge { margin-top: 4px; font-size: 0.85rem; color: #4cc9f0; }

    .intent-badge {
      position: absolute;
      top: -38px;
      background-color: #1a0910;
      border: 2px solid #e63946;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #ff9999;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    /* 하단 카드 영역 */
    #controls-area {
      height: 230px;
      background-color: #0c0914;
      border-top: 4px solid #281d3b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .pile-box {
      width: 80px;
      height: 100px;
      background-color: #171226;
      border: 3px solid #3d2f54;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .pile-title { font-size: 0.8rem; color: #8b739b; }
    .pile-count { font-size: 1.2rem; color: #ffffff; }

    #hand-container {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .card {
      width: 120px;
      height: 180px;
      background-color: #181325;
      border: 3px solid #524368;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .card:hover { transform: translateY(-15px); border-color: #4cc9f0; }

    .card-cost {
      position: absolute;
      top: -10px; left: -10px;
      width: 26px; height: 26px;
      background-color: #2a6f97;
      border: 2px solid #ffffff;
      color: white;
      font-size: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-title { text-align: center; font-size: 0.85rem; margin-top: 6px; color: #f8fafc; }

    .card-art-box {
      width: 100%; height: 45px;
      background-color: #0c0914;
      border: 1px solid #3d2f54;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
    }

    .card-description {
      font-size: 0.75rem;
      color: #e2e8f0;
      text-align: center;
      line-height: 1.3;
      background-color: #100c19;
      padding: 6px 4px;
      border: 1px solid #2d2438;
      border-radius: 2px;
    }

    .attack-card { border-color: #a8201a; }
    .defense-card { border-color: #143642; }
    .skill-card { border-color: #9b59b6; }

    .card.unplayable { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); }
    .card.unplayable:hover { transform: none; }

    .right-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #end-turn-btn {
      width: 90px; height: 45px;
      background-color: #a8201a;
      color: white;
      border: 2px solid #f07167;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #end-turn-btn:active { background-color: #781612; transform: translateY(2px); }

    @keyframes hurt {
      0% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      60% { transform: translateX(8px); }
      100% { transform: translateX(0); }
    }
    .shake { animation: hurt 0.15s ease-in-out; }

    /* 커스텀 팝업/상점/스킬 트리 모달 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.hidden { display: none; }

    .modal-box {
      width: 620px;
      background-color: #120e1e;
      border: 4px solid #ffcc00;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
    }

    .modal-title { font-size: 1.6rem; color: #ffcc00; margin-bottom: 10px; }
    .modal-desc { font-size: 0.95rem; color: #e0e0e0; margin-bottom: 16px; line-height: 1.4; }

    .shop-container, .skill-container {
      display: flex;
      justify-content: space-around;
      gap: 12px;
      margin-bottom: 20px;
    }

    .shop-item, .skill-item {
      background-color: #1a1528;
      border: 2px solid #524368;
      padding: 12px;
      width: 30%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .shop-item-title, .skill-title { font-size: 0.9rem; color: #ffcc00; }
    .shop-item-desc, .skill-desc { font-size: 0.75rem; color: #b0a8bf; }
    
    .buy-btn, .skill-btn {
      padding: 6px 12px;
      background-color: #2b6cb0;
      border: 1px solid #63b3ed;
      color: white;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .buy-btn:hover, .skill-btn:hover { background-color: #3182ce; }

    .modal-btn {
      padding: 10px 24px;
      background-color: #a8201a;
      color: white;
      border: 2px solid #f07167;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .modal-btn:hover { background-color: #c92a2a; }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 상단 바 -->
    <header id="top-bar">
      <div class="status-item"><span class="label">체력:</span><span id="player-hp-text" class="value">80/80</span></div>
      <div class="status-item"><span class="label">마나:</span><span id="player-mana-text" class="value">3/3</span></div>
      <div class="status-item"><span class="label">골드:</span><span id="player-gold-text" class="value">100</span>G</div>
      <div class="status-item"><span class="label">스킬 포인트:</span><span id="player-sp-text" class="value">0</span>SP</div>
      <div class="status-item"><span class="label">층수:</span><span id="stage-text" class="value">1 / 5</span></div>
    </header>

    <!-- 던전 전투 필드 -->
    <main id="battle-field">
      <div class="torch left"></div>
      <div class="torch right"></div>

      <!-- 용사 -->
      <div class="entity-box player-box">
        <div id="player-fx" class="fx-overlay"></div>
        <canvas id="player-canvas" class="pixel-canvas" width="16" height="16"></canvas>
        <div class="entity-info">
          <div class="name">용사</div>
          <div class="hp-bar-container">
            <div id="player-hp-bar" class="hp-bar" style="width: 100%;"></div>
            <span id="player-hp-bar-text" class="hp-text">80 / 80</span>
          </div>
          <div id="player-shield-text" class="shield-badge">방어: 0</div>
        </div>
      </div>

      <!-- 적 몬스터 -->
      <div class="entity-box enemy-box">
        <div id="enemy-fx" class="fx-overlay"></div>
        <div class="intent-badge">
          <span id="enemy-intent-text">공격 8</span>
        </div>
        <canvas id="enemy-canvas" class="pixel-canvas" width="16" height="16"></canvas>
        <div class="entity-info">
          <div id="enemy-name" class="name">고블린</div>
          <div class="hp-bar-container">
            <div id="enemy-hp-bar" class="hp-bar enemy-hp" style="width: 100%;"></div>
            <span id="enemy-hp-bar-text" class="hp-text">40 / 40</span>
          </div>
          <div id="enemy-shield-text" class="shield-badge">방어: 0</div>
        </div>
      </div>
    </main>

    <!-- 하단 카드 영역 -->
    <footer id="controls-area">
      <div class="pile-box">
        <span class="pile-title">덱</span>
        <span id="deck-count" class="pile-count">0</span>
      </div>

      <div id="hand-container"></div>

      <div class="right-controls">
        <button id="end-turn-btn">턴 종료</button>
        <div class="pile-box">
          <span class="pile-title">버린 카드</span>
          <span id="discard-count" class="pile-count">0</span>
        </div>
      </div>
    </footer>

    <!-- 통합 상점 / 스킬 트리 / 클리어 모달 -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <div id="modal-title" class="modal-title">던전 상점</div>
        <div id="modal-desc" class="modal-desc">골드와 스킬 포인트를 사용해 정비하세요.</div>
        
        <!-- 상점 컨테이너 -->
        <div id="shop-container" class="shop-container"></div>

        <!-- 스킬트리 컨테이너 -->
        <div id="skill-container" class="skill-container"></div>

        <button id="modal-btn" class="modal-btn">다음 층으로 전진</button>
      </div>
    </div>
  </div>

  <script>
    // === 1. 픽셀 도트 그려주는 함수 ===
    function drawPixelSprite(canvasId, pixelData) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 16, 16);

      pixelData.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) {
          const color = row[x];
          if (color !== '.') {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 1, 1);
          }
        }
      });
    }

    const HERO_SPRITE = [
      "................", ".....######.....", "....########....", "....#CCCCCCC#...",
      "....#FFFFFF#....", "....#F#FF#F#....", "....#FFFFFF#....", "....#FFFFFF#....",
      "....#CCCCCC#....", "...##########...", "..############..", "..#.########.#..",
      "..#.#.####.#.#..", "....#.####.#....", "....###..###....", "....###..###...."
    ].map(row => row.split('').map(c => c === '#' ? '#4a5568' : c === 'C' ? '#2b6cb0' : c === 'F' ? '#fbd38d' : '.'));

    const MONSTER_SPRITES = [
      ["................", "...G........G...", "...GG......GG...", "....GGGGGGGG....", "....GGGGGGGG....", "....GGRGGGRG....", "....GGGGGGGG....", "....GGGWWGGG....", ".....GGGGGG.....", "....BGGGGGGB....", "...BBGGGGGGBB...", "...B.GGGGGG.B...", ".....BBBBBB.....", ".....GG..GG.....", ".....GG..GG.....", "....GGG..GGG...."].map(r => r.split('').map(c => c === 'G' ? '#38a169' : c === 'R' ? '#e53e3e' : c === 'W' ? '#ffffff' : c === 'B' ? '#744210' : '.')),
      ["................", ".....WWWWWW.....", "....WWWWWWWW....", "....WW#WW#WW....", "....WWWWWWWW....", ".....WW##WW.....", "......WWWW......", "....WWWWWWWW....", "...WW.WWWW.WW...", "...WW.WWWW.WW...", "......WWWW......", ".....WW..WW.....", ".....WW..WW.....", "....WWW..WWW....", "....WWW..WWW....", "................"].map(r => r.split('').map(c => c === 'W' ? '#e2e8f0' : c === '#' ? '#1a202c' : '.')),
      ["................", "....F......F....", "....FF....FF....", ".....FFFFFF.....", "....FFFFFF0F....", "....F0FFFF0F....", "....FFFFFFFF....", "....FFFFFFFF....", ".....FFFFFF.....", "....FFFFFFFF....", "...FFFFFFFFFF...", "...F.FFFFFF.F...", ".....FFFFFF.....", ".....FFFFFF.....", "....FF....FF....", "................"].map(r => r.split('').map(c => c === 'F' ? '#dd6b20' : c === '0' ? '#ffcc00' : '.')),
      ["................", "................", "....########....", "....########....", "....##BBBB##....", "....########....", "....########....", "...##########...", "..############..", "..#.########.#..", "..#.#.####.#.#..", "....#.####.#....", "....###..###....", "....###..###....", "....###..###....", "................"].map(r => r.split('').map(c => c === '#' ? '#718096' : c === 'B' ? '#e53e3e' : '.')),
      ["..R..........R..", "..RR........RR..", "...RR......RR...", "....RRRRRRRR....", "....RRDDRRDR....", "....RRRRRRRR....", "....RRWWWWWR....", ".....RRRRRR.....", "...DDRRRRRRDD...", "..DDDRRRRRRDDD..", "..D.RRRRRRRR.D..", "....RRRRRRRR....", "....RRRRRRRR....", "....DD....DD....", "....DD....DD....", "...DDD....DDD..."].map(r => r.split('').map(c => c === 'R' ? '#9b2c2c' : c === 'D' ? '#1a202c' : c === 'W' ? '#ffc069' : '.'))
    ];

    // === 2. 게임 데이터 설정 ===
    const CARD_DB = {
      strike: { name: '타격', cost: 1, type: 'attack', icon: '⚔️', desc: '적에게 6 피해' },
      defend: { name: '수비', cost: 1, type: 'defense', icon: '🛡️', desc: '방어도 5 획득' },
      bash: { name: '강격', cost: 2, type: 'attack', icon: '💥', desc: '적에게 12 피해' },
      double_strike: { name: '연속 베기', cost: 1, type: 'attack', icon: '⚔️', desc: '4 피해를 2번 연속 공격' },
      vampire: { name: '흡혈검', cost: 2, type: 'attack', icon: '🩸', desc: '8 피해를 주고 4 체력 회복' },
      iron_wall: { name: '철벽', cost: 1, type: 'defense', icon: '🏰', desc: '방어도 8 획득' }
    };

    const STAGES = [
      { name: '고블린', maxHp: 40, baseAtk: 6, goldReward: 50, spriteIdx: 0 },
      { name: '스켈레톤 전사', maxHp: 75, baseAtk: 11, goldReward: 80, spriteIdx: 1 },
      { name: '화염 악마', maxHp: 110, baseAtk: 15, goldReward: 120, spriteIdx: 2 },
      { name: '어둠의 듀라한', maxHp: 150, baseAtk: 19, goldReward: 160, spriteIdx: 3 },
      { name: '마왕 디아블로', maxHp: 220, baseAtk: 25, goldReward: 300, spriteIdx: 4 }
    ];

    let currentStageIndex = 0;

    let state = {
      player: { 
        maxHp: 80, hp: 80, maxMana: 3, mana: 3, shield: 0, gold: 100, sp: 0,
        bonusAtk: 0, bonusDef: 0 
      },
      enemy: { name: '', maxHp: 0, hp: 0, shield: 0, intent: { type: 'attack', value: 0 } },
      deck: [], hand: [], discard: []
    };

    // DOM 요소
    const $hand = document.getElementById('hand-container');
    const $playerHpText = document.getElementById('player-hp-text');
    const $playerHpBarText = document.getElementById('player-hp-bar-text');
    const $playerHpBar = document.getElementById('player-hp-bar');
    const $playerManaText = document.getElementById('player-mana-text');
    const $playerShieldText = document.getElementById('player-shield-text');
    const $playerGoldText = document.getElementById('player-gold-text');
    const $playerSpText = document.getElementById('player-sp-text');

    const $enemyName = document.getElementById('enemy-name');
    const $enemyHpBarText = document.getElementById('enemy-hp-bar-text');
    const $enemyHpBar = document.getElementById('enemy-hp-bar');
    const $enemyShieldText = document.getElementById('enemy-shield-text');
    const $enemyIntentText = document.getElementById('enemy-intent-text');
    const $stageText = document.getElementById('stage-text');

    const $deckCount = document.getElementById('deck-count');
    const $discardCount = document.getElementById('discard-count');
    const $endTurnBtn = document.getElementById('end-turn-btn');

    const $modalOverlay = document.getElementById('modal-overlay');
    const $modalTitle = document.getElementById('modal-title');
    const $modalDesc = document.getElementById('modal-desc');
    const $modalBtn = document.getElementById('modal-btn');
    const $shopContainer = document.getElementById('shop-container');
    const $skillContainer = document.getElementById('skill-container');

    function initGame() {
      drawPixelSprite('player-canvas', HERO_SPRITE);
      
      state.deck = [
        { ...CARD_DB.strike }, { ...CARD_DB.strike }, { ...CARD_DB.strike },
        { ...CARD_DB.defend }, { ...CARD_DB.defend }, { ...CARD_DB.defend },
        { ...CARD_DB.bash }
      ];
      
      shuffle(state.deck);
      loadStage(0);
    }

    function loadStage(index) {
      currentStageIndex = index;
      const stageData = STAGES[index];

      state.enemy.name = stageData.name;
      state.enemy.maxHp = stageData.maxHp;
      state.enemy.hp = stageData.maxHp;
      state.enemy.shield = 0;

      $enemyName.innerText = stageData.name;
      $stageText.innerText = `${index + 1} / ${STAGES.length}`;

      drawPixelSprite('enemy-canvas', MONSTER_SPRITES[stageData.spriteIdx]);
      startTurn();
    }

    function startTurn() {
      state.player.mana = state.player.maxMana;
      state.player.shield = 0;

      drawCards(4);
      decideEnemyIntent();
      updateUI();
    }

    function drawCards(amount) {
      for (let i = 0; i < amount; i++) {
        if (state.deck.length === 0) {
          if (state.discard.length === 0) break;
          state.deck = [...state.discard];
          state.discard = [];
          shuffle(state.deck);
        }
        state.hand.push(state.deck.pop());
      }
    }

    // === 시각 이펙트 트리거 ===
    function triggerFx(targetId, type) {
      const container = document.getElementById(targetId);
      const fx = document.createElement('div');
      fx.className = type === 'slash' ? 'slash-fx' : 'shield-fx';
      container.appendChild(fx);

      setTimeout(() => fx.remove(), 400);
    }

    function playCard(index) {
      const card = state.hand[index];
      if (state.player.mana < card.cost) return;
      
      state.player.mana -= card.cost;
      
      if (card.type === 'attack') {
        triggerFx('enemy-fx', 'slash');
        let bonusAtk = state.player.bonusAtk;
        if (card.name === '타격') damageEnemy(6 + bonusAtk);
        else if (card.name === '강격') damageEnemy(12 + bonusAtk);
        else if (card.name === '연속 베기') { damageEnemy(4 + bonusAtk); damageEnemy(4 + bonusAtk); }
        else if (card.name === '흡혈검') {
          damageEnemy(8 + bonusAtk);
          state.player.hp = Math.min(state.player.maxHp, state.player.hp + 4);
        }
      } else if (card.type === 'defense') {
        triggerFx('player-fx', 'shield');
        let bonusDef = state.player.bonusDef;
        if (card.name === '수비') state.player.shield += (5 + bonusDef);
        else if (card.name === '철벽') state.player.shield += (8 + bonusDef);
      }

      state.discard.push(state.hand.splice(index, 1)[0]);
      updateUI();
      checkBattleStatus();
    }

    function damageEnemy(amount) {
      const $enemy = document.querySelector('.enemy-box');
      $enemy.classList.add('shake');
      setTimeout(() => $enemy.classList.remove('shake'), 150);

      if (state.enemy.shield > 0) {
        if (state.enemy.shield >= amount) {
          state.enemy.shield -= amount;
          amount = 0;
        } else {
          amount -= state.enemy.shield;
          state.enemy.shield = 0;
        }
      }
      state.enemy.hp = Math.max(0, state.enemy.hp - amount);
    }

    function damagePlayer(amount) {
      triggerFx('player-fx', 'slash');
      const $player = document.querySelector('.player-box');
      $player.classList.add('shake');
      setTimeout(() => $player.classList.remove('shake'), 150);

      if (state.player.shield > 0) {
        if (state.player.shield >= amount) {
          state.player.shield -= amount;
          amount = 0;
        } else {
          amount -= state.player.shield;
          state.player.shield = 0;
        }
      }
      state.player.hp = Math.max(0, state.player.hp - amount);
    }

    function decideEnemyIntent() {
      const baseAtk = STAGES[currentStageIndex].baseAtk;
      const rand = Math.random();

      if (rand < 0.65) {
        const atkVal = baseAtk + Math.floor(Math.random() * 4);
        state.enemy.intent = { type: 'attack', value: atkVal, text: `공격 ${atkVal}` };
      } else {
        const defVal = 6 + currentStageIndex * 3;
        state.enemy.intent = { type: 'defense', value: defVal, text: `방어 ${defVal}` };
      }
    }

    $endTurnBtn.addEventListener('click', () => {
      state.discard.push(...state.hand);
      state.hand = [];
      
      if (state.enemy.intent.type === 'attack') {
        damagePlayer(state.enemy.intent.value);
      } else if (state.enemy.intent.type === 'defense') {
        state.enemy.shield += state.enemy.intent.value;
      }
      
      updateUI();
      if (checkBattleStatus()) return;
      
      setTimeout(() => startTurn(), 350);
    });

    function checkBattleStatus() {
      if (state.enemy.hp <= 0) {
        const stage = STAGES[currentStageIndex];
        state.player.gold += stage.goldReward;
        state.player.sp += 1; // 클리어 시 SP 1 획득

        if (currentStageIndex + 1 < STAGES.length) {
          showShopAndSkillModal();
        } else {
          showModal("최종 승리!", "던전의 모든 마왕을 물리쳤습니다!", "처음부터 다시", () => location.reload());
        }
        return true;
      }

      if (state.player.hp <= 0) {
        showModal("게임 오버", "용사가 던전의 어둠 속에서 패배했습니다...", "다시 시도", () => location.reload());
        return true;
      }

      return false;
    }

    // === 던전 상점 및 스킬 트리 UI ===
    function showShopAndSkillModal() {
      $shopContainer.style.display = 'flex';
      $skillContainer.style.display = 'flex';
      
      renderShopUI();
      renderSkillUI();

      $modalTitle.innerText = "던전 상점 & 스킬 트리";
      $modalDesc.innerText = `적을 처치해 ${STAGES[currentStageIndex].goldReward}골드와 1 SP를 얻었습니다. 정비 후 전진하세요!`;
      
      $modalBtn.onclick = () => {
        $modalOverlay.classList.add('hidden');
        loadStage(currentStageIndex + 1);
      };
      
      $modalOverlay.classList.remove('hidden');
    }

    function renderShopUI() {
      $shopContainer.innerHTML = `
        <div class="shop-item">
          <div class="shop-item-title">체력 회복 (30)</div>
          <div class="shop-item-desc">HP 30 회복</div>
          <button class="buy-btn" onclick="buyHeal()">50 G</button>
        </div>
        <div class="shop-item">
          <div class="shop-item-title">강격 카드</div>
          <div class="shop-item-desc">덱에 강격 추가</div>
          <button class="buy-btn" onclick="buyCard('bash')">80 G</button>
        </div>
        <div class="shop-item">
          <div class="shop-item-title">연속 베기</div>
          <div class="shop-item-desc">덱에 연사 카드 추가</div>
          <button class="buy-btn" onclick="buyCard('double_strike')">100 G</button>
        </div>
      `;
    }

    function renderSkillUI() {
      $skillContainer.innerHTML = `
        <div class="skill-item">
          <div class="skill-title">검술 연마</div>
          <div class="skill-desc">모든 공격 피해 +2 (현재: +${state.player.bonusAtk})</div>
          <button class="skill-btn" onclick="upgradeSkill('atk')">1 SP</button>
        </div>
        <div class="skill-item">
          <div class="skill-title">철벽 방어</div>
          <div class="skill-desc">모든 방어도 +2 (현재: +${state.player.bonusDef})</div>
          <button class="skill-btn" onclick="upgradeSkill('def')">1 SP</button>
        </div>
        <div class="skill-item">
          <div class="skill-title">생명력 단련</div>
          <div class="skill-desc">최대 HP +20 증가</div>
          <button class="skill-btn" onclick="upgradeSkill('hp')">1 SP</button>
        </div>
      `;
    }

    window.buyHeal = function() {
      if (state.player.gold >= 50) {
        state.player.gold -= 50;
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 30);
        updateUI();
        renderShopUI();
      }
    };

    window.buyCard = function(key) {
      const price = key === 'bash' ? 80 : 100;
      if (state.player.gold >= price) {
        state.player.gold -= price;
        state.deck.push({ ...CARD_DB[key] });
        updateUI();
        renderShopUI();
      }
    };

    window.upgradeSkill = function(type) {
      if (state.player.sp >= 1) {
        state.player.sp -= 1;
        if (type === 'atk') state.player.bonusAtk += 2;
        else if (type === 'def') state.player.bonusDef += 2;
        else if (type === 'hp') {
          state.player.maxHp += 20;
          state.player.hp += 20;
        }
        updateUI();
        renderSkillUI();
      }
    };

    function showModal(title, desc, btnText, onClickAction) {
      $shopContainer.style.display = 'none';
      $skillContainer.style.display = 'none';
      $modalTitle.innerText = title;
      $modalDesc.innerText = desc;
      $modalBtn.innerText = btnText;
      $modalOverlay.classList.remove('hidden');
      $modalBtn.onclick = onClickAction;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function updateUI() {
      $playerHpText.innerText = `${state.player.hp}/${state.player.maxHp}`;
      $playerHpBarText.innerText = `${state.player.hp}/${state.player.maxHp}`;
      $playerHpBar.style.width = `${(state.player.hp / state.player.maxHp) * 100}%`;
      $playerManaText.innerText = `${state.player.mana}/${state.player.maxMana}`;
      $playerShieldText.innerText = `방어: ${state.player.shield}`;
      $playerGoldText.innerText = state.player.gold;
      $playerSpText.innerText = state.player.sp;

      $enemyHpBarText.innerText = `${state.enemy.hp}/${state.enemy.maxHp}`;
      $enemyHpBar.style.width = `${(state.enemy.hp / state.enemy.maxHp) * 100}%`;
      $enemyShieldText.innerText = `방어: ${state.enemy.shield}`;
      $enemyIntentText.innerText = state.enemy.intent.text;

      $deckCount.innerText = state.deck.length;
      $discardCount.innerText = state.discard.length;

      $hand.innerHTML = '';
      state.hand.forEach((card, index) => {
        const $card = document.createElement('div');
        const isUnplayable = state.player.mana < card.cost;
        
        $card.className = `card ${card.type === 'attack' ? 'attack-card' : 'defense-card'} ${isUnplayable ? 'unplayable' : ''}`;
        $card.innerHTML = `
          <div class="card-cost">${card.cost}</div>
          <div class="card-title">${card.name}</div>
          <div class="card-art-box">${card.icon}</div>
          <div class="card-description">${card.desc}</div>
        `;

        if (!isUnplayable) {
          $card.addEventListener('click', () => playCard(index));
        }

        $hand.appendChild($card);
      });
    }

    initGame();
  </script>
</body>
</html>
